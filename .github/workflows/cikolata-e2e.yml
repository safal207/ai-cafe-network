name: Çikolata Evim E2E visual smoke

on:
  pull_request:
    paths:
      - 'public/demos/cikolata-evim/**'
      - 'tests/cikolata-e2e.spec.cjs'
      - '.github/workflows/cikolata-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branded-menu-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright without changing the project lockfile
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static menu server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public/demos/cikolata-evim >/tmp/cikolata-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cikolata-server.log
          exit 1
      - name: Smoke test 320px, 390px, 768px and 1280px
        run: npx playwright test tests/cikolata-e2e.spec.cjs --reporter=line --workers=1
        env:
          CI: 'true'
      - name: Upload screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cikolata-e2e-evidence
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7
